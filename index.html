<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vajra Sutra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; font-family: 'Arial', sans-serif; overflow: hidden; background-color: #000; }
        
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }

        .active { display: flex; opacity: 1; }

        .overlay { text-align: center; z-index: 10; width: 100%; }

        /* Animation for Emojis */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .animated-emoji { display: inline-block; animation: bounce 1.5s infinite ease-in-out; }

        /* Text Colors & Shadows */
        #step1 h2 { color: #ffffff; } 
        #step2 h2 { color: #fff176; } 
        #step3 h2 { color: #ff80ab; } 

        h2 { 
            font-size: 2.2rem; 
            text-shadow: 3px 3px 15px rgba(0,0,0,0.8); 
            margin-bottom: 40px;
            padding: 0 20px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid white;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="songs.mp3" loop></audio>

    <div id="step1" class="screen active" style="background-image: url('giftbox.gif');">
        <div class="overlay">
            <h2>Click for Surprise <span class="animated-emoji">🎁</span></h2>
            <button class="glass-btn" onclick="next(1, 2)">Tap Here</button>
        </div>
    </div>

    <div id="step2" class="screen" style="background-image: url('dance.gif');">
        <div class="overlay">
            <h2>Itni jldi bhi kya he Nanhi Pari <span class="animated-emoji">💃🏽</span></h2>
            <button class="glass-btn" onclick="next(2, 3)">Agay Chalo</button>
        </div>
    </div>

    <div id="step3" class="screen" style="background-image: url('birthday.gif');">
        <div class="overlay">
            <h2><span class="animated-emoji">💓</span> Happy Birthday Sweety <span class="animated-emoji">💓</span></h2>
        </div>
    </div>

    <script>
        function next(curr, nxt) {
            const audio = document.getElementById('bgMusic');
            if(curr === 1) audio.play().catch(() => { console.log("Music interaction needed"); });

            const c = document.getElementById('step' + curr);
            const n = document.getElementById('step' + nxt);

            c.style.opacity = '0';
            setTimeout(() => {
                c.classList.remove('active');
                n.classList.add('active');
                setTimeout(() => { n.style.opacity = '1'; }, 50);
            }, 1000);
        }
    </script>
</body>
</html>
