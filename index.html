<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vajra Sutra</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background-color: black; }
        
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1s ease-in-out;
            opacity: 0;
        }

        .active { display: flex; opacity: 1; }

        .content-overlay {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }

        h2 { font-size: 2.5rem; font-weight: bold; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); margin-bottom: 30px; }
        
        /* Text Colors based on images */
        #step1 h2 { color: #ffffff; } /* Gift Box - White text */
        #step2 h2 { color: #ffeb3b; } /* Dancing - Yellow text */
        #step3 h2 { color: #f48fb1; } /* Birthday - Pink text */

        .invisible-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" src="songs.mp3" loop></audio>

    <div id="step1" class="screen active" style="background-image: url('giftbox.gif');">
        <div class="content-overlay">
            <h2>Click for Surprise 🎁</h2>
            <button class="invisible-btn" onclick="nextStep(1, 2)">Tap Here</button>
        </div>
    </div>

    <div id="step2" class="screen" style="background-image: url('dance.gif');">
        <div class="content-overlay">
            <h2>Itni jldi bhi kya he Nanhi Pari 💃🏽</h2>
            <button class="invisible-btn" onclick="nextStep(2, 3)">Agay Chalo</button>
        </div>
    </div>

    <div id="step3" class="screen" style="background-image: url('birthday.gif');">
        <div class="content-overlay">
            <h2>Happy Birthday Sweety 💓</h2>
        </div>
    </div>

    <script>
        function nextStep(current, next) {
            const audio = document.getElementById('bgMusic');
            if(current === 1) audio.play().catch(() => console.log("Music play blocked"));

            const curEl = document.getElementById('step' + current);
            const nextEl = document.getElementById('step' + next);

            curEl.style.opacity = '0';
            setTimeout(() => {
                curEl.classList.remove('active');
                nextEl.classList.add('active');
                setTimeout(() => { nextEl.style.opacity = '1'; }, 50);
            }, 1000);
        }
    </script>
</body>
</html>
